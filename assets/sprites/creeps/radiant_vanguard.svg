<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 288" width="256" height="288">
  <defs>
    <linearGradient id="rv_au" x1=".15" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffeab0"/><stop offset=".45" stop-color="#d4a944"/><stop offset="1" stop-color="#4e3408"/>
    </linearGradient>
    <linearGradient id="rv_au2" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#e0bb5f"/><stop offset="1" stop-color="#372603"/>
    </linearGradient>
    <linearGradient id="rv_teal" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#5fd6a8"/><stop offset="1" stop-color="#14503b"/>
    </linearGradient>
    <linearGradient id="rv_steel" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#eef5f7"/><stop offset=".5" stop-color="#9aa8ad"/><stop offset="1" stop-color="#2b353a"/>
    </linearGradient>
    <filter id="rv_soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <ellipse cx="128" cy="264" rx="60" ry="13" fill="#000" opacity=".42" filter="url(#rv_soft)"/>

  <g stroke="#151a10" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">

