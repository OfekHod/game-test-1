    <path d="M100 128 q-20 4 -30 20" fill="none" stroke="url(#rv_au2)" stroke-width="16" stroke-linecap="round"/>
    <path d="M66 112 q36 8 36 46 q0 42 -36 64 q-36 -22 -36 -64 q0 -38 36 -46 z" fill="url(#rv_au2)"/>
    <path d="M66 124 q27 7 27 35 q0 32 -27 50 q-27 -18 -27 -50 q0 -28 27 -35 z" fill="url(#rv_teal)" stroke-width="2.6"/>
    <circle cx="66" cy="164" r="13" fill="url(#rv_au)"/>
    <path d="M66 152 l6 12 l-6 12 l-6 -12 z" fill="#ffeab0" stroke-width="2"/>
  </g>

  <!-- RIM LIGHT -->
  <g fill="none" stroke="#fff6d6" stroke-opacity=".5" stroke-width="3" stroke-linecap="round">
    <path d="M104 62 q-16 8 -18 26"/>
    <path d="M92 112 q-22 4 -26 22"/>
    <path d="M36 138 q-4 22 0 42"/>
    <path d="M100 172 l-8 34"/>
