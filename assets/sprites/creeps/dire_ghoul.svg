    <radialGradient id="dg_eye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff4b0"/><stop offset=".35" stop-color="#ff5a2a"/><stop offset="1" stop-color="#e8301a" stop-opacity="0"/>
    </radialGradient>
    <filter id="dg_soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <ellipse cx="130" cy="266" rx="66" ry="13" fill="#000" opacity=".5" filter="url(#dg_soft)"/>

