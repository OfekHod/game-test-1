<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 288" width="256" height="288">
  <defs>
    <linearGradient id="dg_flesh" x1=".25" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#b6bf90"/><stop offset=".45" stop-color="#6b7853"/><stop offset="1" stop-color="#252b19"/>
    </linearGradient>
    <linearGradient id="dg_flesh2" x1=".25" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#77855c"/><stop offset=".5" stop-color="#454f33"/><stop offset="1" stop-color="#171b0e"/>
    </linearGradient>
    <linearGradient id="dg_bone" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fbf6dc"/><stop offset=".6" stop-color="#c6bd97"/><stop offset="1" stop-color="#79704f"/>
    </linearGradient>
    <linearGradient id="dg_blade" x1=".1" y1="0" x2=".9" y2="1">
